name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Versions match
        run: node dev/check-version.mjs
      - name: Built panel is up to date
        run: |
          npm run build
          git diff --exit-code custom_components/style_studio/www/studio-panel.js

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Glass Sidebar does the sidebar; test against the real integration.
      - uses: actions/checkout@v4
        with:
          repository: roykolk20-design/Home-assistant-glasssidebar
          path: glass
      - run: cp -r glass/custom_components/glass_sidebar custom_components/
      - run: pip install pytest-homeassistant-custom-component
      - run: python dev/install-frontend.py
      - run: python -m pytest -q -rs
