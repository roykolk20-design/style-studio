<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Style Studio harness</title>
<!--
  A rough copy of HA's sidebar DOM plus a fake `hass`, to try the panel and
  Glass Sidebar's runtime (from its own repository) without Home Assistant. Not a substitute for testing in HA.
  Run: node dev/serve.mjs, then open http://localhost:8123/dev/harness.html
  ?page=dark gives the page a dark background; ?glass=missing, not-added,
  disabled or old shows how the panel handles Glass Sidebar's state.
-->
<style>
  :root {
    /* Close to "Licht Warm" */
    --primary-background-color: #f4efe6;
    --secondary-background-color: #ebe3d4;
    --card-background-color: #fffaf2;
    --primary-text-color: #3b3127;
    --secondary-text-color: #7a6c5d;
    --primary-color: #d99a1e;
    --divider-color: #e2d6c3;
    --sidebar-background-color: #fbf6ec;
    --sidebar-selected-icon-color: #f59e0b;
    --sidebar-selected-text-color: #b46f00;
    --text-primary-color: #fff;
  }
  body { margin: 0; background: var(--primary-background-color); font-family: sans-serif; }
</style>
</head>
<body>
<home-assistant></home-assistant>
<script type="module">
  // ha-icon with the real Material Design Icons, like Home Assistant.
  const mdi = await import("/node_modules/@mdi/js/mdi.js");
  customElements.define("ha-icon", class extends HTMLElement {
    static observedAttributes = ["icon"];
    // Drawing while Lit clones a template isn't allowed, so only once connected.
    set icon(value) { this._icon = value; if (this.isConnected) this._draw(); }
    get icon() { return this._icon; }
    attributeChangedCallback(_, __, value) { this.icon = value; }
    connectedCallback() {
      this.style.cssText =
        "display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);flex-shrink:0";
      this._draw();
    }
    _draw() {
      const name = "mdi" + String(this._icon ?? "").replace(/^mdi:/, "")
        .split(/[-_]/).map((part) => part.charAt(0).toUpperCase() + part.slice(1)).join("");
      const path = mdi[name] ?? mdi.mdiHelpCircleOutline;
      this.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="currentColor" d="${path}"/></svg>`;
    }
  });

  const params = new URLSearchParams(location.search);
  const panels = {
    lovelace: { url_path: "lovelace", title: null, icon: null },
    "dashboard-plattegrond": { url_path: "dashboard-plattegrond", title: "Plattegrond", icon: "mdi:floor-plan" },
    energy: { url_path: "energy", title: "energy", icon: "mdi:lightning-bolt" },
    map: { url_path: "map", title: "map", icon: "mdi:map" },
    logbook: { url_path: "logbook", title: "logbook", icon: "mdi:format-list-bulleted" },
    history: { url_path: "history", title: "history", icon: "mdi:chart-box" },
    "browser-mod": { url_path: "browser-mod", title: "Browser Mod", icon: "mdi:server" },
    "style-studio": { url_path: "style-studio", title: "Stijl", icon: "mdi:palette-swatch-outline" },
    config: { url_path: "config", title: "config", icon: "mdi:cog" },
  };
  const labels = {
    "panel.states": "Overzicht", "panel.energy": "Energie", "panel.map": "Kaart",
    "panel.logbook": "Logboek", "panel.history": "Geschiedenis", "panel.config": "Instellingen",
  };

  // Glass Sidebar's settings as the panel sees them. The fake backend keeps
  // them in that shape; the accent is a hex color, which the runtime takes as is.
  const glassSettings = {
    floating: true, inset: 8, radius: 20, blur: 18, opacity: 74, highlight: "soft", accent: null,
    hover_motion: true, glass_cards: false, mobile_width: 300, mobile_blur: true, mobile_text_size: 14,
    categories: [
      { name: "Dashboards", panels: ["dashboard-plattegrond", "energy"] },
      { name: "Info", panels: ["logbook", "history", "map"] },
    ],
  };
  // ?glass=missing | not-added | disabled | old
  const glassState = params.get("glass");
  const db = { sidebar: glassState === "missing" || glassState === "not-added" ? null : glassSettings, history: [] };
  const listeners = [];
  const push = () =>
    listeners.forEach((cb) => cb(db.sidebar ? { enabled: true, version: "1.4.0", ...db.sidebar } : { enabled: false }));
  window.__db = db;

  // Themes: the user's own two files, and what Style Studio made.
  const others = {
    "Licht Warm": {
      "primary-background-color": "#f4efe6", "card-background-color": "#fffaf2",
      "primary-text-color": "#3b3127", "primary-color": "#f59e0b",
      "sidebar-background-color": "#fbf6ec", "bubble-pop-up-main-background-color": "#fffaf2",
    },
    "Licht Roze": {
      "primary-background-color": "#fbf1f4", "card-background-color": "#fffafc",
      "primary-text-color": "#3d2b33", "primary-color": "#e8749e",
    },
  };
  let themes = [];
  const themeHistory = [];
  let defaultTheme = "default";
  const themesState = () => ({
    themes,
    loaded: themes.map((t) => t.name),
    others,
    default_theme: defaultTheme,
    history: themeHistory.length,
    file: "/config/themes/style_studio.yaml",
  });
  window.__themes = () => ({ themes, defaultTheme });

  // People: Roy is logged in here; Joyce has used Home Assistant on her phone.
  const VERSION = (await (await fetch("/custom_components/style_studio/manifest.json")).json()).version;
  const users = [
    { id: "8faf3d60", name: "Roy", is_admin: true },
    { id: "3a122b8e", name: "Joyce", is_admin: false },
  ];
  let persons = {};
  const peopleHistory = [];
  const reports = {
    joyce: {
      device: "joyce00001", user_id: "3a122b8e", at: new Date(Date.now() - 3600e3).toISOString(),
      version: "0.1.0", app: true, theme: "Licht Roze",
      sidebar: { panelOrder: ["lovelace", "map"], hiddenPanels: ["logbook", "history"] },
    },
  };
  let userSidebar = { panelOrder: ["lovelace", "energy"], hiddenPanels: [] };
  const personListeners = [];
  const pushPerson = () =>
    personListeners.forEach((cb) => cb({ version: VERSION, ...(persons[users[0].id] ?? {}) }));
  const peopleState = () => ({
    users,
    persons,
    reports: Object.values(reports).sort((a, b) => b.at.localeCompare(a.at)),
    themes: [...themes.map((t) => t.name), ...Object.keys(others)].sort(),
    history: peopleHistory.length,
    version: VERSION,
  });
  window.__people = () => ({ persons, reports, userSidebar, appliedTheme: window.__appliedTheme });

  // Devices: two air conditioners (one LG-like), lights, rooms on floors.
  const states = {
    "climate.woonkamer": {
      entity_id: "climate.woonkamer", state: "cool",
      attributes: {
        friendly_name: "LG Woonkamer", hvac_modes: ["off", "cool", "heat", "auto", "dry", "fan_only"],
        fan_modes: ["auto", "low", "medium", "high"], fan_mode: "auto",
        swing_modes: ["off", "on"], swing_mode: "off",
        swing_horizontal_modes: ["off", "on"], swing_horizontal_mode: "on",
        temperature: 21, current_temperature: 23.5, min_temp: 16, max_temp: 30, target_temp_step: 0.5,
      },
    },
    "climate.slaapkamer": {
      entity_id: "climate.slaapkamer", state: "heat",
      attributes: {
        friendly_name: "Slaapkamer", hvac_modes: ["off", "heat"], temperature: 19,
        current_temperature: 18, min_temp: 7, max_temp: 25, target_temp_step: 0.5,
      },
    },
  };
  const light = (id, name, state) =>
    (states[id] = { entity_id: id, state, attributes: { friendly_name: name } });
  light("light.woonkamer_plafond", "Plafondlamp", "on");
  light("light.woonkamer_staande", "Staande lamp", "off");
  light("light.keuken", "Keukenlamp", "on");
  light("light.slaapkamer", "Slaapkamerlamp", "off");
  light("light.zolder", "Zolderlamp", "off");
  const floors = {
    begane_grond: { floor_id: "begane_grond", name: "Begane grond", level: 0, icon: "mdi:home-floor-0" },
    eerste: { floor_id: "eerste", name: "1e verdieping", level: 1, icon: "mdi:home-floor-1" },
    zolder: { floor_id: "zolder", name: "Zolder", level: 2, icon: "mdi:home-roof" },
  };
  const areas = {
    woonkamer: { area_id: "woonkamer", name: "Woonkamer", icon: "mdi:sofa", floor_id: "begane_grond" },
    keuken: { area_id: "keuken", name: "Keuken", icon: "mdi:fridge", floor_id: "begane_grond" },
    slaapkamer: { area_id: "slaapkamer", name: "Slaapkamer", icon: "mdi:bed", floor_id: "eerste" },
    zolder: { area_id: "zolder", name: "Zolder", icon: null, floor_id: "zolder" },
  };
  const entities = Object.fromEntries(
    Object.keys(states).map((id) => {
      const area = Object.keys(areas).find((a) => id.includes(a)) ?? null;
      return [id, { entity_id: id, area_id: area, device_id: null }];
    })
  );

  // Dashboards: the main one has a sections view; one is in panel mode.
  const dashboards = {
    __main: {
      views: [
        { title: "Licht", path: "licht", type: "sections", max_columns: 4,
          sections: [{ type: "grid", cards: [{ type: "heading", heading: "Thuis" }] }] },
        // Hand-made cards with fixed colors and corners, like the real ones.
        { title: "Energie", path: "energie", cards: [
          { type: "custom:button-card", name: "Batterij",
            styles: { card: [{ "border-radius": "24px" }, { "background-color": "#D99A1E" }] } },
          { type: "markdown", content: "<span style='color: #123456'>Stroom</span>" },
        ] },
      ],
    },
    "dashboard-plattegrond": { views: [{ title: "Plattegrond", type: "panel", cards: [{ type: "picture-elements" }] }] },
  };
  const backups = [];
  window.__lovelace = () => ({ dashboards, backups });

  const hass = {
    states,
    entities,
    devices: {},
    areas,
    floors,
    user: users[0],
    selectedTheme: { theme: "Licht Warm" },
    language: "nl",
    locale: { language: "nl" },
    panels,
    localize: (key) => labels[key] ?? "",
    async callWS(msg) {
      switch (msg.type) {
        case "frontend/get_user_data":
          return { value: structuredClone(userSidebar) };
        case "frontend/set_user_data":
          userSidebar = structuredClone(msg.value);
          return null;
        case "lovelace/dashboards/list":
          return [{ url_path: "dashboard-plattegrond", title: "Plattegrond", mode: "storage" }];
        case "lovelace/config":
          return structuredClone(dashboards[msg.url_path ?? "__main"]);
        case "lovelace/config/save":
          dashboards[msg.url_path ?? "__main"] = structuredClone(msg.config);
          return null;
        case "lovelace/resources":
          return [];
        case "style_studio/backups/create":
          backups.push({ file: `${msg.key}.${backups.length}.json`, key: msg.key, data: msg.data,
            saved_at: new Date().toISOString(), size: JSON.stringify(msg.data).length });
          return { file: backups.at(-1).file };
        case "style_studio/backups/list":
          return { backups: backups.map(({ data, ...rest }) => rest).reverse() };
        case "style_studio/backups/read":
          return { data: backups.find((b) => b.file === msg.file).data };
        case "style_studio/check":
          return {
            version: VERSION,
            glass_sidebar: true,
            card_mod_themes: [{ theme: "Licht Warm", keys: ["card-mod-sidebar", "card-mod-theme"], sidebar: true }],
            themes_not_loaded: [],
            devices: Object.values(reports).map((r) => ({ ...r, user: users.find((u) => u.id === r.user_id)?.name })),
          };
        case "style_studio/history/list": {
          const list = (items, summary) =>
            items.map((value, index) => ({ index, saved_at: new Date().toISOString(), summary: summary(value) })).reverse();
          return {
            themes: list(themeHistory, (v) => v.map((t) => t.name).join(", ") || "-"),
            glass_sidebar: list(db.history, (v) => `radius: ${v?.radius}`),
            people: list(peopleHistory, (v) => `${Object.keys(v).length}`),
          };
        }
        case "style_studio/history/restore": {
          if (msg.key === "themes") { const v = themeHistory[msg.index]; themeHistory.push(structuredClone(themes)); themes = structuredClone(v); }
          if (msg.key === "glass_sidebar") { const v = db.history[msg.index]; db.history.push(db.sidebar); db.sidebar = v; push(); }
          if (msg.key === "people") { const v = peopleHistory[msg.index]; peopleHistory.push(structuredClone(persons)); persons = structuredClone(v); }
          return { restored: true };
        }
        case "style_studio/people/get":
          return peopleState();
        case "style_studio/people/save": {
          peopleHistory.push(structuredClone(persons));
          const now = new Date().toISOString();
          const next = {};
          for (const [id, value] of Object.entries(msg.persons)) {
            const old = persons[id] ?? {};
            const person = {};
            for (const key of ["theme", "sidebar"]) {
              if (value[key] == null) continue;
              person[key] = value[key];
              person[`${key}_updated`] =
                JSON.stringify(old[key]) === JSON.stringify(value[key]) ? old[`${key}_updated`] : now;
            }
            if (Object.keys(person).length) next[id] = person;
          }
          persons = next;
          pushPerson();
          return peopleState();
        }
        case "style_studio/people/undo":
          if (!peopleHistory.length) return { restored: false, ...peopleState() };
          persons = peopleHistory.pop();
          pushPerson();
          return { restored: true, ...peopleState() };
        case "style_studio/person/report":
          reports[msg.device] = {
            device: msg.device, user_id: users[0].id, at: new Date().toISOString(), version: msg.version,
            app: msg.app, theme: msg.theme, sidebar: msg.sidebar,
          };
          return null;
        case "style_studio/get":
          return {
            version: VERSION,
            glass_sidebar: {
              version: glassState === "missing" ? null : glassState === "old" ? "1.2.1" : "1.4.0",
              min_version: "1.4.0",
              added: Boolean(db.sidebar),
              loaded: Boolean(db.sidebar) && glassState !== "disabled",
              sidebar: db.sidebar,
              history: db.history.length,
            },
          };
        case "style_studio/sidebar/save":
          db.history.push(db.sidebar);
          db.sidebar = msg.sidebar;
          push();
          return { sidebar: msg.sidebar };
        case "style_studio/themes/get":
          return themesState();
        case "style_studio/themes/save": {
          const theme = { ...msg.theme, id: msg.theme.id ?? Math.random().toString(16).slice(2, 10) };
          const taken = [...themes.filter((t) => t.id !== theme.id).map((t) => t.name), ...Object.keys(others)];
          if (taken.some((n) => n.toLowerCase() === theme.name.toLowerCase())) {
            throw Object.assign(new Error("name taken"), { code: "name_taken" });
          }
          themeHistory.push(structuredClone(themes));
          const index = themes.findIndex((t) => t.id === theme.id);
          if (index === -1) themes.push(theme);
          else themes[index] = theme;
          return { theme, ...themesState() };
        }
        case "style_studio/themes/delete":
          themeHistory.push(structuredClone(themes));
          themes = themes.filter((t) => t.id !== msg.theme_id);
          return themesState();
        case "style_studio/themes/undo":
          if (!themeHistory.length) return { restored: false, ...themesState() };
          themes = themeHistory.pop();
          return { restored: true, ...themesState() };
        case "style_studio/themes/set_default":
          defaultTheme = msg.name;
          return themesState();
        case "style_studio/sidebar/undo": {
          if (!db.history.length) return { restored: false };
          db.sidebar = db.history.pop();
          push();
          return { restored: true };
        }
      }
      throw new Error(`unknown command ${msg.type}`);
    },
    connection: {
      subscribeMessage(cb, msg) {
        if (msg.type === "style_studio/person/subscribe") {
          personListeners.push(cb);
          setTimeout(pushPerson);
          return Promise.resolve(() => {});
        }
        if (msg.type !== "glass_sidebar/subscribe") return Promise.reject(new Error(msg.type));
        listeners.push(cb);
        setTimeout(push);
        return Promise.resolve(() => {});
      },
    },
  };

  // home-assistant > home-assistant-main > ha-drawer (.sidebar-shell, .app-content) + ha-sidebar
  const ha = document.querySelector("home-assistant");
  ha.hass = hass;
  const main = document.createElement("home-assistant-main");
  ha.attachShadow({ mode: "open" }).append(main);
  const mainRoot = main.attachShadow({ mode: "open" });
  // HA switches to a modal drawer below 870px.
  const narrow = innerWidth <= 870;
  main.toggleAttribute(narrow ? "modal" : "expanded", true);
  mainRoot.innerHTML = `
    <style>:host { display: block; --ha-sidebar-width: 256px; } ha-drawer { display: block; }</style>
    <ha-drawer><ha-sidebar slot="sidebar" ${narrow ? "narrow" : ""} expanded></ha-sidebar>
      <style-studio-panel></style-studio-panel></ha-drawer>`;

  const drawer = mainRoot.querySelector("ha-drawer");
  drawer.attachShadow({ mode: "open" }).innerHTML = `
    <style>
      .layout { display: flex; min-height: 100vh; }
      .sidebar-shell {
        width: var(--ha-sidebar-width); flex-shrink: 0; box-sizing: border-box; height: 100vh;
        position: sticky; top: 0; border-inline-end: 1px solid var(--divider-color);
      }
      /* Like Home Assistant: the panel gets a screen-high box that cuts off
         overflow, so the panel has to scroll by itself. */
      .app-content {
        flex: 1; min-width: 0; height: 100vh; overflow: hidden;
        ${params.get("page") === "dark" ? "background: radial-gradient(circle at 70% 30%, #2b3440, #0d1117 70%);" : ""}
      }
    </style>
    <div class="layout">
      ${narrow ? "" : `<div class="sidebar-shell"><slot name="sidebar"></slot></div>`}
      <div class="app-content"><slot></slot></div>
    </div>`;

  const sidebar = mainRoot.querySelector("ha-sidebar");
  const order = ["lovelace", "energy", "dashboard-plattegrond", "map", "logbook", "history", "browser-mod", "style-studio"];
  sidebar.attachShadow({ mode: "open" }).innerHTML = `
    <style>
      :host { display: flex; flex-direction: column; height: 100%; color: var(--primary-text-color); }
      .menu { height: 56px; display: flex; align-items: center; padding: 0 16px; }
      slot[name=main-navigation] { display: flex; flex-direction: column; }
      ha-list-item-button {
        display: flex; align-items: center; gap: 20px; height: 40px; padding: 0 12px; margin: 0 4px;
        position: relative;
      }
      ha-list-item-button.selected::before { content: ""; position: absolute; inset: 0; }
    </style>
    <div class="menu">Home Assistant</div>
    <ha-list-nav class="before-spacer"><slot name="main-navigation">
      ${order.map((path) => `
        <ha-list-item-button id="sidebar-panel-${path}" class="${path === "style-studio" ? "selected" : ""}">
          <ha-icon slot="start" icon="${panels[path].icon ?? "mdi:view-dashboard"}"></ha-icon>
          <span class="item-text">${labels[`panel.${panels[path].title}`] ?? panels[path].title ?? "Overzicht"}</span>
        </ha-list-item-button>`).join("")}
    </slot></ha-list-nav>`;

  const panel = mainRoot.querySelector("style-studio-panel");
  panel.narrow = narrow;
  // HA's own handler for "settheme": remember the theme the runtime picked.
  ha.addEventListener("settheme", (ev) => {
    window.__appliedTheme = ev.detail.theme;
    hass.selectedTheme = { theme: ev.detail.theme };
  });
  await import("/glass_sidebar/sidebar.js");
  await import("/custom_components/style_studio/www/person.js");
  await import("/custom_components/style_studio/www/studio-panel.js");
  panel.hass = hass;
</script>
</body>
</html>
